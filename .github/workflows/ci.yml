name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check-latest: go.mod names only the minor version, and the runner's cached Go
      # may lag behind a security release that govulncheck already reports.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: make check-web
      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    # Publishes ghcr.io/<owner>/ocap-statistics for linux/amd64 and linux/arm64.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The binaries are built here rather than in Docker: the Go build cache is restored
      # between runs, so only changed packages compile (not the SQLite driver every time).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: actions/cache@v4
        with:
          # Its own key: the test job's cache has no arm64 or non-race objects.
          key: go-image-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-image-${{ runner.os }}-
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build binaries
        env:
          LDFLAGS: -s -w -X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ github.sha }} -X main.date=${{ github.event.head_commit.timestamp }}
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="$LDFLAGS" -o dist/ocap-stats-linux-$arch ./cmd/ocap-stats
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

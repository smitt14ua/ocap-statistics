<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../app.css">
  <style>
    .wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .logo { height: 36px; }
    .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); }

    input, select { width: 100%; }
    .inline { width: auto; }
    input[type="color"] { padding: 2px; height: 36px; width: 56px; }
    label.field { display: flex; flex-direction: column; gap: 4px; }
    label.field > span { font-size: 12px; color: var(--muted); }
    .hint { font-size: 12px; color: var(--dim); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .spacer { flex: 1; }
    .section-title { margin: 22px 0 12px; }

    .tabs { display: flex; overflow-x: auto; gap: 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 600; }
    .tabs button.active { color: var(--text-strong); border-bottom-color: var(--accent); }
    .tabs button:hover:not(.active) { color: var(--text); background: none; }
    .tab { display: none; padding-top: 16px; }
    .tab.active { display: block; }

    .progress { height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
    .progress > div { height: 100%; background: var(--accent); transition: width .3s; }

    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
    .kv dt { color: var(--muted); }
    .kv dd { color: var(--text-strong); word-break: break-all; }

    .tasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
    .task { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .task b { color: var(--text-strong); }
    .task p { font-size: 12px; color: var(--muted); flex: 1; }
    .task button { align-self: flex-start; }

    .table-wrap.limited { max-height: 480px; }

    .side { display: grid; grid-template-columns: 1fr 56px 2fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
    @media (max-width: 700px) { .side { grid-template-columns: 1fr 56px; } .side > :nth-child(3) { grid-column: 1 / -1; } }

    .login { max-width: 360px; margin: 10vh auto 0; }
    .login form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  </style>
  <script src="../i18n.js"></script>
</head>

<body>
  <div class="wrap">
    <main class="card login" id="loginView" aria-labelledby="loginTitle" hidden>
      <div class="row"><h1 id="loginTitle" data-i18n="login.title">Sign in</h1><span class="spacer"></span><select class="lang-select inline" id="langLogin" data-i18n-aria="lang.label"></select></div>
      <form id="loginForm">
        <label class="field"><span data-i18n="login.user">Username</span><input type="text" id="loginUser" autocomplete="username" required></label>
        <label class="field"><span data-i18n="login.pass">Password</span><input id="loginPass" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit" data-i18n="login.submit">Sign in</button>
        <div class="bad" id="loginError" role="alert"></div>
      </form>
    </main>

    <div id="appView" hidden>
      <header class="card topbar">
        <div class="brand"><span id="logoSlot"></span><h1 id="title">Admin</h1></div>
        <div class="who">
          <span><span data-i18n="adm.signedIn">Signed in as</span> <b id="whoami" class="ok"></b></span>
          <select class="lang-select inline" id="lang" data-i18n-aria="lang.label"></select>
          <a class="btn" href="../" data-i18n="adm.toSite">Site</a>
          <a class="btn" href="../api/docs" target="_blank" rel="noopener">API</a>
          <button type="button" id="logout" data-i18n="adm.logout">Log out</button>
        </div>
      </header>

      <main class="card" style="margin-top: 16px;" aria-labelledby="title">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="t-status" aria-controls="tab-status" aria-selected="true" data-tab="status" class="active" data-i18n="tab.status">Status</button>
          <button type="button" role="tab" id="t-settings" aria-controls="tab-settings" aria-selected="false" tabindex="-1" data-tab="settings" data-i18n="tab.settings">Settings</button>
          <button type="button" role="tab" id="t-nicknames" aria-controls="tab-nicknames" aria-selected="false" tabindex="-1" data-tab="nicknames" data-i18n="tab.nicknames">Nicknames</button>
          <button type="button" role="tab" id="t-access" aria-controls="tab-access" aria-selected="false" tabindex="-1" data-tab="access" data-i18n="tab.access">Access</button>
        </div>

        <!-- Status -->
        <section class="tab active" id="tab-status" role="tabpanel" aria-labelledby="t-status" tabindex="0">
          <div class="tiles" id="tiles" style="margin-bottom: 16px;"></div>
          <div id="taskBox" style="margin-bottom: 16px;"></div>

          <h2 class="section-title" data-i18n="tasks.title">Tasks</h2>
          <div class="tasks">
            <div class="task">
              <b data-i18n="task.sync.title">Sync now</b>
              <p data-i18n="task.sync.desc"></p>
              <button type="button" class="primary" data-task="sync" data-i18n="btn.run">Run</button>
            </div>
            <div class="task">
              <b data-i18n="task.recompute.title">Recompute statistics</b>
              <p data-i18n="task.recompute.desc"></p>
              <button type="button" class="primary" data-task="recompute" data-i18n="btn.run">Run</button>
            </div>
            <div class="task">
              <b data-i18n="task.retry.title">Retry failed</b>
              <p data-i18n="task.retry.desc"></p>
              <button type="button" data-task="retry-errors" data-i18n="btn.run">Run</button>
            </div>
            <div class="task">
              <b data-i18n="task.resync.title">Full resync</b>
              <p data-i18n="task.resync.desc"></p>
              <button type="button" class="danger" data-task="resync" data-confirm="btn.confirmAgain" data-i18n="btn.run">Run</button>
            </div>
          </div>

          <h3 data-i18n="svc.title">Service</h3>
          <dl class="kv" id="serviceInfo"></dl>

          <h3 data-i18n="failed.title">Processing errors</h3>
          <div class="table-wrap limited" tabindex="0">
            <table>
              <thead><tr><th scope="col" data-i18n="col.id">ID</th><th scope="col" data-i18n="col.recording">Recording</th><th scope="col" data-i18n="col.date">Date</th><th scope="col" data-i18n="col.attempts">Attempts</th><th scope="col" data-i18n="col.error">Error</th><th scope="col" data-i18n="col.nextAttempt">Next attempt</th></tr></thead>
              <tbody id="failedBody"></tbody>
            </table>
          </div>
        </section>

        <!-- Settings -->
        <section class="tab" id="tab-settings" role="tabpanel" aria-labelledby="t-settings" tabindex="0">
          <p class="hint" id="customNote" style="margin-bottom: 14px;"></p>
          <form id="settingsForm">
            <h2 data-i18n="sec.recordings">Recordings</h2>
            <div class="grid" style="margin-top: 12px;">
              <label class="field"><span data-i18n="f.tags">Tags</span><input type="text" id="sTags" placeholder="COOP, TVT">
                <span class="hint" data-i18n="f.tags.hint"></span></label>
              <label class="field"><span data-i18n="f.defaultTag">Default tag</span><input type="text" id="sDefaultTag">
                <span class="hint" data-i18n="f.defaultTag.hint"></span></label>
              <label class="field"><span data-i18n="f.since">Since</span><input id="sSince" type="date">
                <span class="hint" data-i18n="f.since.hint"></span></label>
              <label class="field"><span data-i18n="f.minDuration">Minimum duration</span><input id="sMinDuration" type="number" min="0" step="1">
                <span class="hint" data-i18n="f.minDuration.hint"></span></label>
            </div>

            <h2 class="section-title" data-i18n="sec.rotation">Rotation</h2>
            <div class="grid" style="margin-bottom: 12px;">
              <label class="field"><span data-i18n="f.rotSince">Count rotation from</span><input id="sRotationSince" type="date"></label>
            </div>
            <div id="sides"></div>
            <button type="button" id="addSide" class="small" data-i18n="side.add">+ Add side</button>

            <div class="row" style="margin-top: 24px;">
              <button type="submit" class="primary" data-i18n="btn.save">Save</button>
              <span class="spacer"></span>
              <button type="button" id="resetSettings" class="danger" data-confirm="btn.resetConfirm" data-i18n="btn.reset">Reset</button>
            </div>
          </form>
        </section>

        <!-- Nicknames -->
        <section class="tab" id="tab-nicknames" role="tabpanel" aria-labelledby="t-nicknames" tabindex="0">
          <form id="nickForm">
            <div class="grid">
              <label class="field"><span data-i18n="f.format">Nickname format</span>
                <select id="nPreset">
                  <option value="\[~?(.*?)~?\]\s*" data-i18n="preset.std"></option>
                  <option value="^\s*~?([^|]+?)~?\s*\|\s*" data-i18n="preset.pipe"></option>
                  <option value="\s*\[~?(.*?)~?\]\s*$" data-i18n="preset.suffix"></option>
                  <option value="" data-i18n="preset.custom"></option>
                </select>
              </label>
              <label class="field"><span data-i18n="f.regex">Regex</span>
                <input type="text" id="nPattern" class="mono" spellcheck="false">
              </label>
            </div>
            <p class="hint" style="margin-top: 6px;" data-i18n="nick.recruits"></p>

            <div class="grid" style="margin-top: 14px;">
              <label class="field"><span data-i18n="f.aliases">Aliases</span>
                <textarea id="nAliases" spellcheck="false" placeholder="A.L.P.H.A. = ALPHA"></textarea>
                <span class="hint" data-i18n="f.aliases.hint"></span></label>
              <label class="field"><span data-i18n="f.ignore">Ignored names</span>
                <textarea id="nIgnore" spellcheck="false" placeholder="Zeus"></textarea>
                <span class="hint" data-i18n="f.ignore.hint"></span></label>
            </div>

            <div class="row" style="margin-top: 14px;">
              <button type="button" id="preview" data-i18n="btn.preview">Preview</button>
              <button type="submit" class="primary" data-i18n="btn.saveRecompute">Save and recompute</button>
            </div>
          </form>

          <div id="previewBox" hidden style="margin-top: 16px;">
            <div class="row" style="margin-bottom: 8px;">
              <input id="previewFilter" type="search" class="inline" data-i18n-placeholder="preview.filter" data-i18n-aria="preview.filter" style="max-width: 260px;">
              <span class="muted" id="previewSummary"></span>
            </div>
            <div class="table-wrap limited" tabindex="0">
              <table>
                <thead><tr><th scope="col" data-i18n="col.nickname">Nickname</th><th scope="col" data-i18n="col.player">Player</th><th scope="col" data-i18n="col.squad">Squad</th><th scope="col"><span class="sr-only" data-i18n="col.status">Status</span></th></tr></thead>
                <tbody id="previewBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Access -->
        <section class="tab" id="tab-access" role="tabpanel" aria-labelledby="t-access" tabindex="0">
          <h2 data-i18n="users.title">Users</h2>
          <div class="table-wrap" style="margin-top: 10px;">
            <table>
              <thead><tr><th scope="col" data-i18n="col.login">Username</th><th scope="col" data-i18n="col.created">Created</th><th scope="col"><span class="sr-only" data-i18n="col.actions">Actions</span></th></tr></thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>

          <h3 data-i18n="users.add">Add user</h3>
          <form id="addUser" class="row">
            <input type="text" id="newUser" class="inline" data-i18n-placeholder="ph.user" data-i18n-aria="ph.user" autocomplete="off" required style="max-width: 220px;">
            <input id="newPass" class="inline" type="password" data-i18n-placeholder="ph.pass" data-i18n-aria="ph.pass" autocomplete="new-password" required minlength="8" style="max-width: 260px;">
            <button class="primary" type="submit" data-i18n="btn.add">Add</button>
          </form>
          <p class="hint" style="margin-top: 14px;" data-i18n="users.note"></p>
        </section>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="admin.js"></script>
</body>

</html>
